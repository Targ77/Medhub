services:
  postgres:
    image: postgres:16
    container_name: medhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medhub
      POSTGRES_USER: medhub_user
      POSTGRES_PASSWORD: medhub_password
    ports:
      - "5432:5432"
    volumes:
      - medhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medhub_user -d medhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medhub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medhub.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  medhub-postgres-data:
