spring:
  application:
    name: medhub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medhub}
    username: ${DB_USERNAME:medhub_user}
    password: ${DB_PASSWORD:medhub_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true